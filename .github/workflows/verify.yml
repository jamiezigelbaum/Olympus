name: verify

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Every push to main gets its own finished verdict: a newer push never
# cancels or replaces a main run, so each head an rc build might take has
# one. Pull requests still cancel their own superseded runs.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Reject added high-confidence credential patterns
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/credential-pattern-check.ts --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Keep the raw-sleep allowance shrinking
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun scripts/raw-sleep-allowance-check.ts --base "$BASE_SHA"
      - name: Keep AI tools out of commit authorship
        # Jamie's rule: commits are his (and named human contributors'), never
        # Claude's or Codex's. Commits land straight on main, so check every
        # pushed range as well as any pull request.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bad=$(git log --format='%h %an <%ae> %cn <%ce>%x09%(trailers:key=Co-authored-by,valueonly,separator=%x2C)' "$BASE_SHA..$HEAD_SHA" \
            | grep -iE '@(anthropic|openai)\.com|claude|codex' || true)
          if [ -n "$bad" ]; then
            echo "These commits name an AI tool as author, committer or co-author:"
            echo "$bad"
            echo "Re-author them as the person (git commit --amend --reset-author, or rebase with --exec), drop AI Co-authored-by lines, and push again."
            exit 1
          fi
      - run: bun run contracts:check
      - run: bun run typecheck
      - run: bun run dist:check
      - id: release-artifact
        name: Build or prove the fail-closed release-artifact gate
        run: bun scripts/release-artifact-ci.ts
      - if: ${{ steps.release-artifact.outputs.ready == 'true' }}
        run: bun run artifact:receipt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.release-artifact.outputs.ready == 'true' }}
        with:
          name: olympus-release-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            release-artifacts/*.tgz
            release-artifacts/ci-provenance.json
          if-no-files-found: error
          retention-days: 14

  fast:
    name: fast tests ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      OLYMPUS_JUNIT_PATH: test-results/fast-${{ matrix.shard }}.xml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun scripts/test-lane.ts fast --shard=${{ matrix.shard }}/3
      - if: ${{ matrix.shard == 1 }}
        run: bun run test:connect-relay
      - name: Retain trusted main fast-lane timing data
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-timing-${{ github.sha }}-${{ matrix.shard }}
          path: test-results/fast-${{ matrix.shard }}.xml
          if-no-files-found: error
          retention-days: 30

  exchange:
    # Own job: one 30 s file that ran after the fast lane on its critical path.
    name: exchange tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test:exchange
      # The privacy-judge calibration tests live in eval/, outside every lane.
      - run: bun run test:calibration

  loop-stall-quick:
    # A quick cold loop-stall test (plan, 16 Nov 2026): a 40k-item fixture under a 400 MB cap, both engines, 120 s; fails on
    # any loop beat over 1 s and prints the site. It caught the freeze before 7216b4b4 twice (2.7 s, 1.7 s). Not a required
    # check; the 600k gate on Sparta stays the bar for candidates. Runs only when engine or store code changed.
    name: loop-stall quick
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 50
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: changed
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null && ! git diff --name-only "$BEFORE" HEAD | grep -qE '^(src/workers/(engine|connector-store|classification|file-extraction)/|src/core/(source-storage|sqlite|tier)|scripts/loop-stall-test\.ts)'; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No engine or store code changed."
          else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.changed.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - if: steps.changed.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - if: steps.changed.outputs.run == 'true'
        run: |
          export HOME="$(mktemp -d)"
          bun scripts/loop-stall-test.ts build --dir "$RUNNER_TEMP/ls" --items 40000
          sudo systemd-run --scope --quiet --uid="$(id -u)" --gid="$(id -g)" -p MemoryMax=400M -p MemorySwapMax=0 \
            --setenv=HOME="$HOME" --setenv=PATH="$PATH" -- \
            bun scripts/loop-stall-test.ts run --dir "$RUNNER_TEMP/ls" --seconds 120 --memory-max 400M --io-floor-ms 200 --io-wait-seconds 60 --quick

  put-back-mac:
    # The put-back must hold on APFS too (step-back, 16 Nov 2026). Not a required check.
    name: put-back on macOS
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: HOME="$(mktemp -d)" bun test test/put-back-whole-root.test.ts test/engine-store-copies.test.ts

  deploy:
    name: deploy tests ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      OLYMPUS_REQUIRE_TOOLCHAINS: '1'
      OLYMPUS_REQUIRE_HOST_LOADER: '1'
      OLYMPUS_JUNIT_PATH: test-results/deploy-${{ matrix.shard }}.xml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Ensure shellcheck is available
        run: command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
      - name: Ensure private Secret Service test dependencies are available
        run: |
          if ! command -v dbus-daemon >/dev/null || ! /usr/bin/python3 -c 'from gi.repository import Gio, GLib'; then
            sudo apt-get update
            sudo apt-get install -y dbus-daemon python3-gi
          fi
      - name: Install the qualified OpenClaw host for the plugin-loader test
        # The plugin entry is loaded by OpenClaw's synchronous loader, and that
        # test can only prove it against a real install. Without this it would
        # skip in every lane, which reports a pass for a check that never ran;
        # OLYMPUS_REQUIRE_HOST_LOADER=1 turns that skip into a failure.
        # Installed outside the repository so it cannot disturb the workspace
        # dependency tree. Pinned to the qualified host floor.
        run: npm install --prefix "$RUNNER_TEMP/openclaw-host" --no-save --no-audit --no-fund --ignore-scripts openclaw@2026.7.1
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun scripts/test-lane.ts deploy --shard=${{ matrix.shard }}/4
        env:
          OLYMPUS_OPENCLAW_INSTALL_DIR: ${{ runner.temp }}/openclaw-host/node_modules/openclaw
      - name: The upgrade's store copy under a real systemd user unit
        # The runner's own user manager, started by lingering: the real unit,
        # its Restart= policy and its upgrade hold (gate7 rc.11, 13 Nov).
        if: matrix.shard == 1
        run: |
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for i in $(seq 1 50); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 0.2; done
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user is-system-running || true
          REAL_SYSTEMD_USER_HOME="$HOME" HOME="$(mktemp -d)" bun test test/real-systemd-upgrade-hold.test.ts
      - name: The upgrade started on the oldest Bun an install can have
        # Worker-unit installs made before 1.5 run on the machine's own Bun,
        # 1.3.14 on the gate7 VM and Sparta (rc.12, 14 Nov). The upgrade's first
        # step starts there and must move onto the pinned Bun or refuse.
        if: matrix.shard == 1
        run: |
          dir="$RUNNER_TEMP/bun-1.3.14"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/bun.zip" https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64-baseline.zip
          unzip -oq "$dir/bun.zip" -d "$dir"
          OLDEST_INSTALL_BUN="$dir/bun-linux-x64-baseline/bun" HOME="$(mktemp -d)" bun test test/engine-bun.test.ts
      - name: Retain trusted main timing data
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-timing-${{ github.sha }}-${{ matrix.shard }}
          path: test-results/deploy-${{ matrix.shard }}.xml
          if-no-files-found: error
          retention-days: 30

  go:
    name: Go bridge tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OLYMPUS_REQUIRE_TOOLCHAINS: '1'
      OLYMPUS_JUNIT_PATH: test-results/go.xml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: |
            tools/whatsapp-bridge/go.sum
            config/go-cache-version
      - run: bun scripts/test-lane.ts go
      - name: Retain trusted main Go timing data
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-timing-${{ github.sha }}
          path: test-results/go.xml
          if-no-files-found: error
          retention-days: 30
