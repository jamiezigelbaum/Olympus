name: verify

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Reject added high-confidence credential patterns
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/credential-pattern-check.ts --base "$BASE_SHA" --head "$HEAD_SHA"
      - run: bun run contracts:check
      - run: bun run typecheck
      - run: bun run dist:check
      - id: release-artifact
        name: Build or prove the fail-closed release-artifact gate
        run: bun scripts/release-artifact-ci.ts
      - if: ${{ steps.release-artifact.outputs.ready == 'true' }}
        run: bun run artifact:receipt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.release-artifact.outputs.ready == 'true' }}
        with:
          name: olympus-release-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            release-artifacts/*.tgz
            release-artifacts/ci-provenance.json
          if-no-files-found: error
          retention-days: 14

  fast:
    name: fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OLYMPUS_JUNIT_PATH: test-results/fast.xml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:fast
      - name: Retain trusted main fast-lane timing data
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-timing-${{ github.sha }}
          path: test-results/fast.xml
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: deploy tests ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      OLYMPUS_REQUIRE_TOOLCHAINS: '1'
      OLYMPUS_REQUIRE_HOST_LOADER: '1'
      OLYMPUS_JUNIT_PATH: test-results/deploy-${{ matrix.shard }}.xml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Ensure shellcheck is available
        run: command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
      - name: Install the qualified OpenClaw host for the plugin-loader test
        # The plugin entry is loaded by OpenClaw's synchronous loader, and that
        # test can only prove it against a real install. Without this it would
        # skip in every lane, which reports a pass for a check that never ran;
        # OLYMPUS_REQUIRE_HOST_LOADER=1 turns that skip into a failure.
        # Installed outside the repository so it cannot disturb the workspace
        # dependency tree. Pinned to the qualified host floor.
        run: npm install --prefix "$RUNNER_TEMP/openclaw-host" --no-save --no-audit --no-fund --ignore-scripts openclaw@2026.7.1
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun scripts/test-lane.ts deploy --shard=${{ matrix.shard }}/3
        env:
          OLYMPUS_OPENCLAW_INSTALL_DIR: ${{ runner.temp }}/openclaw-host/node_modules/openclaw
      - name: Retain trusted main timing data
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-timing-${{ github.sha }}-${{ matrix.shard }}
          path: test-results/deploy-${{ matrix.shard }}.xml
          if-no-files-found: error
          retention-days: 30

  go:
    name: Go bridge tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OLYMPUS_REQUIRE_TOOLCHAINS: '1'
      OLYMPUS_JUNIT_PATH: test-results/go.xml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: |
            tools/whatsapp-bridge/go.sum
            config/go-cache-version
      - run: bun scripts/test-lane.ts go
      - name: Retain trusted main Go timing data
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-timing-${{ github.sha }}
          path: test-results/go.xml
          if-no-files-found: error
          retention-days: 30
