name: hermetic Go qualification

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whatsapp-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: Qualify from an empty build cache
        working-directory: tools/whatsapp-bridge
        env:
          GOCACHE: ${{ runner.temp }}/olympus-hermetic-go-cache
          GOTOOLCHAIN: local
        run: go test -count=1 ./...
