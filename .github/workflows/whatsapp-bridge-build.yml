name: WhatsApp bridge release build

# The prebuilt Apple-silicon WhatsApp bridge a Mac release ships, so pairing
# needs no Go or C compiler. Run it on the exact release commit; publish its
# artifact with scripts/publish-release-to-site.ts --whatsapp-bridge, which
# refuses a bridge whose name is not the fingerprint of the tarball's source.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full 40-character commit SHA of the release
        required: true

permissions:
  contents: read

jobs:
  darwin-arm64:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Require an exact commit
        env:
          REF: ${{ inputs.ref }}
        run: echo "$REF" | grep -Eq '^[0-9a-f]{40}$'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/whatsapp-bridge/go.mod
          cache: false
      - name: Test the bridge
        working-directory: tools/whatsapp-bridge
        env:
          GOTOOLCHAIN: local
        run: go test -count=1 ./...
      - name: Build the bridge
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '1'
          GOOS: darwin
          GOARCH: arm64
          # The installer supports macOS 13 and later.
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          name="$(bun src/core/whatsapp-bridge-name.ts tools/whatsapp-bridge)"
          mkdir -p out
          (cd tools/whatsapp-bridge && go build -trimpath -o "../../out/$name-darwin-arm64" .)
          file "out/$name-darwin-arm64" | grep -q 'Mach-O 64-bit executable arm64'
          (cd out && shasum -a 256 "$name-darwin-arm64" | tee SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whatsapp-bridge-darwin-arm64-${{ inputs.ref }}
          path: out/
          if-no-files-found: error
          retention-days: 90
