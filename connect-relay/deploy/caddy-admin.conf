# Drop-in for Ubuntu's caddy.service, installed by deploy/remote-install.sh as
# /etc/systemd/system/caddy.service.d/olympus-admin.conf. Creates /run/caddy
# (owned by the caddy user, removed when Caddy stops) for the admin socket the
# Caddyfile's `admin unix//run/caddy/admin.sock` names, so no stale socket
# survives a restart.
[Service]
RuntimeDirectory=caddy
RuntimeDirectoryMode=0750
