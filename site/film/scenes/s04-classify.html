<!doctype html>
<html><head><meta charset="UTF-8" /></head>
<body>
<template>
  <style>
    @font-face{font-family:"Newsreader";font-style:normal;font-weight:200 800;font-display:block;src:url("assets/fonts/newsreader.woff2") format("woff2");}
    @font-face{font-family:"Martian Mono";font-weight:100 800;font-display:block;src:url("assets/fonts/martian-mono.woff2") format("woff2");}
    @font-face{font-family:"Nunito";font-weight:200 1000;font-display:block;src:url("assets/fonts/nunito.woff2") format("woff2");}
    #root { position: absolute; inset: 0; overflow: hidden; }
    /* the header rolls from the sources page to this one (same sheet, next section) */
    .s04-roll { position: relative; display: inline-block; clip-path: inset(-0.2em -20em -0.4em -20em); }
    .s04-roll .o { display: inline-block; }
    .s04-roll .n { position: absolute; top: 0; left: 0; white-space: nowrap; }
    .s04-roll.r .n { left: auto; right: 0; }
    /* the feed: a window on the sheet the rows stream up through */
    #s04-classify-win { position: absolute; left: 96px; top: 136px; width: 1228px; height: 712px; overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, black 50px, black 100%); mask-image: linear-gradient(to bottom, transparent 0, black 50px, black 100%); }
    #s04-classify-list { position: absolute; left: 0; top: 24px; width: 1228px; }
    .s04-row { position: absolute; left: 0; width: 1110px; height: 76px; display: flex; align-items: center;
      font-family: "Martian Mono"; font-size: 44px; color: var(--ink); white-space: nowrap; }
    .s04-row .nm { flex: none; }
    .s04-row .ld { flex: 1; height: 0; margin: 0 24px; border-bottom: 5px dotted var(--rule); transform: translateY(12px); transform-origin: 0 50%; }
    .s04-row .tier { flex: none; position: relative; width: 290px; height: 66px; }
    .s04-tier { position: absolute; left: 0; top: 2px; font-size: 40px; border-width: 5px; border-radius: 16px; padding: 1px 18px 3px; }
    .s04-tier.personal { color: var(--clay); border-color: var(--clay); }
    .s04-secret { position: absolute; left: 4px; top: 6px; font-family: "Nunito"; font-weight: 900; font-size: 44px; letter-spacing: 0.06em;
      color: transparent; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="s04-classify" data-width="1920" data-height="1080">
    <div class="pan" id="s04-classify-pan"><div class="cam" id="s04-classify-cam"><div class="shake" id="s04-classify-shake"></div></div></div>
  </div>
  <script>
    (function () {
      const O = window.OLY, T = window.OLY_TL, C = T.scenes["s04-classify"], B = C.beats;
      const $ = (id) => document.getElementById("s04-classify-" + id);
      const shake = $("shake");
      const roll = (a, b, r) => `<span class="s04-roll${r ? " r" : ""}"><span class="o">${a}</span><span class="n">${b}</span></span>`;
      const P = O.page(shake, { header: [roll("Sources", "Classification"), roll("Indexed on your Mac", "Every item judged", true)] });
      const S = P.sheet;
      S.insertAdjacentHTML("beforeend", `<div id="s04-classify-win"><div id="s04-classify-list"></div></div>`);
      const list = $("list");
      // Every item judged (FACTS.md rows 11, 30, 31: fictional file names). The secret row is redacted before its label
      // renders: the label never exists on screen, only the squares where it would be.
      const ROWS = [
        ["flight-receipt.pdf", "personal"], ["therapy-notes.docx", "private"], ["Re: test results", "private"],
        ["Re: dinner Saturday", "personal"], ["passport-scan.jpg", "private"], ["voice-memo-0412.m4a", "personal"],
        ["mortgage-statement.pdf", "private"], ["IMG_2038.heic", "personal"], ["lab-results.pdf", "private"], ["Re: offer letter", "private"],
        ["bank login", "secret"],
        ["IMG_2041.heic", "personal"], ["journal-2026.md", "private"], ["Re: flights home", "personal"]];
      const LH = 76, VIS = 9;
      const rows = ROWS.map(([nm, tier], i) => {
        const r = O.make("div", "s04-row", list, `<span class="nm">${nm}</span><span class="ld"></span><span class="tier"></span>`);
        gsap.set(r, { top: i * LH });
        const slot = r.querySelector(".tier");
        const tag = tier === "secret" ? O.make("span", "s04-secret", slot, "SECRET")
          : O.make("div", `stamp solid s04-tier ${tier}`, slot, tier.toUpperCase());
        return { r, nm: r.querySelector(".nm"), ld: r.querySelector(".ld"), tag, tier };
      });

      O.ready(() => {
        const tl = gsap.timeline({ paused: true });
        const end = C.dur + C.tail;
        // the same sheet as the sources page: no jump, the drift starts from rest
        O.drift(tl, $("cam"), end, { dx: -10, s1: 1.008, breath: 0 });
        // the header rolls to this section
        [...S.querySelectorAll(".s04-roll")].forEach((rl, i) => {
          tl.to(rl.querySelector(".o"), { yPercent: -120, duration: 0.3, ease: "power3.inOut" }, 0.04 + i * 0.05);
          tl.fromTo(rl.querySelector(".n"), { yPercent: 120 }, { yPercent: 0, duration: 0.3, ease: "power3.inOut" }, 0.04 + i * 0.05);
        });

        // When each row lands: three readable rows on the beat, then a feed that speeds up (0.25 s -> 0.08 s apart),
        // the secret row, one beat of dead stop, and the feed resumes.
        const t = [B.r1, (B.r1 + B.r3) / 2, B.r3];
        const n = 7, g = Math.pow(0.08 / 0.25, 1 / (n - 2)), iv = Array.from({ length: n - 1 }, (_, i) => 0.25 * Math.pow(g, i));
        const k = (B.fastLast - B.fast) / iv.reduce((a, b) => a + b);
        t.push(B.fast);
        iv.forEach((d) => t.push(t[t.length - 1] + d * k));
        t.push(B.secretRow, B.resume, B.resume + 0.1, B.resume + 0.2);

        rows.forEach((row, i) => {
          const land = t[i], gap = i ? land - t[i - 1] : 0.5, quick = Math.min(1, gap / 0.5);
          const d = 0.18 + 0.27 * quick;  // fast rows arrive faster
          tl.fromTo(row.nm, { x: 24, opacity: 0 }, { x: 0, opacity: 1, duration: d, ease: "expo.out" }, land - O.AT * d);
          tl.fromTo(row.ld, { scaleX: 0 }, { scaleX: 1, duration: d * 0.9, ease: "expo.out" }, land - 0.04);
          // the list moves up one row for every row past the window
          if (i >= VIS) tl.to(list, { y: -(i - VIS + 1) * LH, duration: Math.min(0.22, Math.max(0.08, gap * 0.9)), ease: "power2.out" }, land - 0.08);
          if (row.tier === "secret") {
            O.redact(tl, row.tag, B.secret, { shake });  // struck before it renders: the squares are all there is
          } else {
            O.stamp(tl, row.tag, land + Math.max(0.06, Math.min(0.22, gap * 0.45)),
              { from: 1.3, rot: ((i * 37) % 7) - 3, fall: 0.07, squash: 0.06, ink: 1, jolt: i < 3 ? [shake] : [], amp: 2 });
          }
        });

        // The local-first sheet slides over this one from the right: this page gives way a little underneath.
        tl.to(P.page, { x: -140, duration: C.tail, ease: "power3.inOut" }, C.dur);
        tl.set({}, {}, end);
        window.__timelines["s04-classify"] = tl;
      });
    })();
  </script>
</template>
</body></html>
