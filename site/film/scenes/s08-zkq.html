<!doctype html>
<html><head><meta charset="UTF-8" /></head>
<body>
<template>
  <style>
    @font-face{font-family:"Newsreader";font-style:normal;font-weight:200 800;font-display:block;src:url("assets/fonts/newsreader.woff2") format("woff2");}
    @font-face{font-family:"Newsreader";font-style:italic;font-weight:200 800;font-display:block;src:url("assets/fonts/newsreader-italic.woff2") format("woff2");}
    @font-face{font-family:"Martian Mono";font-weight:100 800;font-display:block;src:url("assets/fonts/martian-mono.woff2") format("woff2");}
    @font-face{font-family:"Nunito";font-weight:200 1000;font-display:block;src:url("assets/fonts/nunito.woff2") format("woff2");}
    #root { position: absolute; inset: 0; overflow: hidden; }
    .s08-lab { position: absolute; font-family: "Martian Mono"; font-size: 20px; letter-spacing: 0.08em; color: var(--mid); text-transform: uppercase; white-space: nowrap; }
    .s08-box { position: absolute; left: 346px; width: 1228px; background: var(--card); border: 1.5px solid var(--card-rule); border-radius: 18px;
      padding: 30px 38px; font-family: "Newsreader"; font-weight: 400; font-size: 52px; line-height: 1.3; color: var(--ink); }
    .s08-box .id, .s08-box .kp { display: inline-block; white-space: nowrap; }
    #s08-zkq-q1 { top: 230px; }
    .s08-rl { position: absolute; font-family: "Newsreader"; font-size: 44px; line-height: 1.2; color: var(--ink); white-space: nowrap; }
    .s08-rl .arr { font-family: "Martian Mono"; font-style: normal; font-size: 36px; margin-right: 10px; }
    #s08-zkq-l2 { left: 346px; top: 512px; font-size: 48px; font-style: italic; color: var(--ink); }
    #s08-zkq-q2, #s08-zkq-fold { top: 584px; border-color: var(--clay); white-space: nowrap; font-size: 50px; }
    #s08-zkq-q2 .kp { opacity: 0; }
    .s08-hl { position: absolute; left: 0; top: 0; background: rgba(216, 67, 47, 0.28); box-shadow: inset 0 -0.12em 0 rgba(216, 67, 47, 0.75);
      border-radius: 3px; transform-origin: 0 50%; mix-blend-mode: multiply; }
    .s08-clone { position: absolute; left: 0; top: 0; font-family: "Newsreader"; font-weight: 400; font-size: 52px; line-height: 1.3; color: var(--ink);
      white-space: nowrap; opacity: 0; background: var(--card); padding: 0 8px; border-radius: 8px;
      box-shadow: 0 10px 18px -8px rgba(90, 50, 30, 0.38); }
    .s08-clone span { display: inline-block; vertical-align: top; }
    .s08-clone .x { clip-path: inset(-0.4em 0 -0.4em 0); }
    #s08-zkq-rows { position: absolute; left: 346px; top: 750px; font-family: "Martian Mono"; font-size: 44px; line-height: 64px; color: var(--ink); white-space: pre; }
    #s08-zkq-rows .r { display: block; }
    #s08-zkq-rows .k { display: inline-block; width: 6ch; }
    #s08-zkq-route { position: absolute; inset: 0; }
    .s08-node { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; background: var(--bar); }
    .s08-ring { position: absolute; left: 1500px; top: 550px; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 4px solid var(--clay); opacity: 0; }
    .s08-node.end { background: var(--clay); }
    #s08-zkq-wire { position: absolute; left: 420px; top: 547.5px; width: 1080px; height: 5px; transform-origin: 0 50%;
      background: repeating-linear-gradient(90deg, var(--bar) 0 14px, transparent 14px 24px); }
    .s08-ly { position: absolute; left: 0; top: 0; border-radius: 18px; }
    .s08-core { display: flex; align-items: center; justify-content: center; font-family: "Newsreader"; font-style: italic; font-size: 60px; color: var(--ink); }
    #s08-zkq-fold { transform-origin: 0 0; opacity: 0; }
    #s08-zkq-plum { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: var(--bar); transform-origin: 0 0; }
    #s08-zkq-paid { left: 1180px; top: 640px; font-size: 50px; }
  </style>
  <div id="root" data-composition-id="s08-zkq" data-width="1920" data-height="1080">
    <div class="pan" id="s08-zkq-pan"><div class="cam" id="s08-zkq-cam"><div class="shake" id="s08-zkq-shake"></div></div></div>
  </div>
  <script>
    (function () {
      const O = window.OLY, T = window.OLY_TL, C = T.scenes["s08-zkq"], B = C.beats;
      const $ = (id) => document.getElementById("s08-zkq-" + id);
      const shake = $("shake");
      const P = O.page(shake, { flap: true, header: ["Ask anonymously · Strict", '<span class="nc">zkAPI</span> · Tor'] });
      // Everything sits on the sheet (so the page turn at the end folds it away), in frame coordinates.
      const pg = O.make("div", "", P.sheet);
      pg.setAttribute("data-layout-allow-overflow", "");  // content laid out in frame coordinates on purpose
      pg.style.cssText = `position:absolute;left:${-O.SHEET.x}px;top:${-O.SHEET.y}px;width:1920px;height:1080px`;
      pg.insertAdjacentHTML("beforeend", `
        <div class="s08-box" id="s08-zkq-q1">“I’m <span class="id" id="s08-zkq-i1">Sam Rivera</span>. I <span class="kp" id="s08-zkq-o-lost">lost</span> <span class="id" id="s08-zkq-i2">$35,000</span> on <span class="id" id="s08-zkq-i3">my brokerage account</span> this year. <span class="kp" id="s08-zkq-o-how">How</span> do I <span class="kp" id="s08-zkq-o-report">report</span> it <span class="kp" id="s08-zkq-o-on">on</span> my <span class="kp" id="s08-zkq-o-tax">taxes?</span>”</div>
        <div class="s08-rl" id="s08-zkq-l2"><span class="arr">↓</span>Rewritten on your computer</div>
        <div class="s08-box" id="s08-zkq-q2">“<span class="kp" id="s08-zkq-n-how">How</span> are capital <span class="kp" id="s08-zkq-n-lost">losses</span> <span class="kp" id="s08-zkq-n-report">reported</span> <span class="kp" id="s08-zkq-n-on">on</span> a US <span class="kp" id="s08-zkq-n-tax">tax</span> return?”</div>
        <div id="s08-zkq-route">
          <div class="s08-rl" id="s08-zkq-mac" style="left:346px;top:390px">Your computer</div>
          <div class="s08-rl" id="s08-zkq-model" style="left:1574px;top:390px;transform:translateX(-100%)">Answering model</div>
          <div id="s08-zkq-wire"></div>
          <div class="s08-node end" style="left:420px;top:550px"></div>
          <div class="s08-node hop" style="left:760px;top:550px"></div>
          <div class="s08-node hop" style="left:950px;top:550px"></div>
          <div class="s08-node hop" style="left:1140px;top:550px"></div>
          <div class="s08-node end" style="left:1500px;top:550px"></div>
          <div class="s08-rl" id="s08-zkq-tor" style="left:950px;top:390px;transform:translateX(-50%);font-style:italic;color:var(--mid)">three Tor hops</div>
        </div>
        <div id="s08-zkq-rows"><span class="r"><span class="k">FROM</span><span id="s08-zkq-from">Sam’s MacBook</span></span><span class="r"><span class="k">IP</span><span id="s08-zkq-ip">203.0.113.42</span></span><span class="r" id="s08-zkq-key"><span class="k">KEY</span>fresh for this question</span><span class="r" id="s08-zkq-pay"><span class="k">PAID</span>anonymously</span></div>
        <div class="stamp" id="s08-zkq-paid">PAID · zkAPI</div>`);
      const plum = O.make("div", "", shake); plum.id = "s08-zkq-plum";

      O.ready(() => {
        const tl = gsap.timeline({ paused: true });
        const end = C.dur + (C.tail || 0), F = O.FR;
        O.drift(tl, $("cam"), end, { dx: -10, s1: 1.012 });

        // 8a The plum pulls back to reveal the sheet: it shrinks to one inked square, which pops off the page.
        const NX = 1604, NY = 150, NW = 48, NH = 60, PB = 0.55;  // inside the sheet, by the header
        tl.fromTo(plum, { x: 0, y: 0, scaleX: 1, scaleY: 1, borderRadius: "0px" },
          { x: NX, y: NY, scaleX: NW / 1920, scaleY: NH / 1080, borderRadius: "80px", duration: PB, ease: "power3.inOut" }, 0);
        tl.fromTo($("cam"), { scale: 1.06 }, { scale: 1.0, duration: 0.65, ease: "power3.out", immediateRender: false }, 0);
        tl.to(plum, { x: NX + NW / 2, y: NY + NH / 2, scaleX: 0, scaleY: 0, duration: 0.12, ease: "power2.in" }, PB);
        tl.set(plum, { opacity: 0 }, PB + 0.12);

        // The question is dropped in word by word; FROM and IP sit below it.
        tl.fromTo($("q1"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, PB - 0.1);
        O.drop(tl, O.split($("q1")), B.q, { stagger: 0.035 });
        const rows = [...$("rows").querySelectorAll(".r")];
        gsap.set(rows.slice(2), { opacity: 0 });
        O.cut(tl, rows.slice(0, 2), B.q + 0.1);

        // Three red highlighter sweeps mark what identifies you (each on its half-beat).
        const q1 = $("q1");
        ["i1", "i2", "i3"].forEach((id, i) => {
          const r = O.box($(id), q1), h = O.make("div", "s08-hl", q1);
          gsap.set(h, { x: r.x - 6, y: r.y + r.h * 0.12, width: r.w + 12, height: r.h * 0.78, skewX: -10 });
          const t = B["hl" + (i + 1)];
          tl.fromTo(h, { scaleX: 0, opacity: 0 }, { scaleX: 0.3, opacity: 1, duration: F, ease: "none" }, t - F);
          tl.to(h, { scaleX: 1, duration: 0.14, ease: "power3.out" }, t);
        });

        // 8b The three identifiers are redacted, one after another (the film's redaction style).
        ["i1", "i2", "i3"].forEach((id, i) => O.redact(tl, $(id), B["id" + (i + 1)], { shake }));

        // Rewritten on your computer: the meaning words detach from the old line, drop and re-slot into the new one
        // (lost -> losses, report -> reported, taxes? -> tax) while the new words rise around them.
        const R = B.rewrite, MS = 0.12, FL = 0.45;  // MS: seconds between carried words; FL: each flight (v04: faster, Jamie)

        tl.fromTo($("q2"), { opacity: 0, scaleY: 0.7, transformOrigin: "50% 0%" }, { opacity: 1, scaleY: 1, duration: 0.28, ease: "expo.out" }, R - 0.15);
        // what's left of the old line goes: only its redactions stay (no orphaned words under the new line)
        tl.to(q1, { color: "rgba(51, 37, 29, 0)", duration: 0.35, ease: "power2.out" }, R + 0.1);
        const q2 = $("q2");
        const KEEP = [["how", "How", "", ""], ["lost", "los", "t", "ses"], ["report", "report", "", "ed"], ["on", "on", "", ""], ["tax", "tax", "es?", ""]];
        const newWords = O.split(q2).filter((w) => !w.closest(".kp"));
        KEEP.forEach(([k, base, out, inn], i) => {
          const src = $("o-" + k), dst = $("n-" + k), a = O.box(src, pg), b = O.box(dst, pg);
          const cl = O.make("div", "s08-clone", pg, `<span>${base}</span><span class="x o">${out}</span><span class="x n">${inn}</span>`);
          const xo = cl.querySelector(".o"), xn = cl.querySelector(".n");
          const wn = xn.offsetWidth;
          gsap.set(xn, { width: 0 });
          gsap.set(cl, { x: a.x - 8, y: a.y, transformOrigin: "0px 0px" });  // a slip of paper: the padding sits outside the word
          const t0 = R + i * MS, K = 50 / 52;  // one word at a time, landing at the new line's size
          tl.set(cl, { opacity: 1 }, t0);
          tl.set(src, { opacity: 0 }, t0);
          // cut out and lifted (a paper slip, so crossing words pass over each other, never overprint), then re-slotted
          tl.fromTo(cl, { boxShadow: "0 0px 0px 0px rgba(90, 50, 30, 0)" }, { boxShadow: "0 10px 18px -8px rgba(90, 50, 30, 0.38)", duration: 0.1, ease: "power2.out" }, t0);
          tl.to(cl, { y: a.y - 12, scale: 1.06, duration: 0.1, ease: "power2.out" }, t0);
          tl.to(cl, { x: b.x - 8 * K, duration: FL, ease: "power3.inOut" }, t0 + 0.1);
          tl.to(cl, { y: b.y, scale: K, duration: FL, ease: "power2.inOut" }, t0 + 0.1);
          tl.to(cl, { boxShadow: "0 0px 0px 0px rgba(90, 50, 30, 0)", duration: 0.12, ease: "power2.in" }, t0 + FL);
          if (out) { tl.to(xo, { width: 0, y: 14, opacity: 0, duration: 0.18, ease: "power2.in" }, t0 + 0.2); }
          if (inn) { tl.fromTo(xn, { width: 0 }, { width: wn, duration: 0.2, ease: "power3.out", immediateRender: false }, t0 + FL - 0.1); }
          tl.set(cl, { opacity: 0 }, t0 + FL + 0.13);  // hands over once it has landed
          tl.set(dst, { opacity: 1 }, t0 + FL + 0.13);
        });
        const ML = R + (KEEP.length - 1) * MS + FL + 0.13;  // the last carried word has landed (R + 1.06 s)
        O.rise(tl, newWords, ML + 0.1, { dur: 0.4, stagger: 0.03 });
        O.cut(tl, $("l2"), ML + 0.05);  // the label once the words have landed (nothing flies through it)

        // 8c Once the rewrite has been read: the old question leaves, the rewrite moves up, the route draws.
        const U = B.route, DY = 230 - 584, RY = -80;
        tl.to(q1, { y: -40, opacity: 0, duration: 0.22, ease: "power2.in" }, U - 0.22);
        tl.to($("l2"), { opacity: 0, duration: 0.15, ease: "power2.in" }, U - 0.05);
        tl.to(q2, { y: DY, duration: 0.42, ease: "power3.inOut" }, U);
        tl.to($("rows"), { y: RY, duration: 0.42, ease: "power3.inOut" }, U);
        const route = $("route");
        const nodes = [...route.querySelectorAll(".s08-node")];
        gsap.set([$("mac"), $("model"), $("tor")], { opacity: 0 });
        tl.fromTo($("wire"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.inOut" }, U + 0.12);
        nodes.forEach((n, i) => tl.fromTo(n, { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.2)" }, U + 0.12 + i * 0.07));
        O.cut(tl, [$("mac"), $("model")], U + 0.45);
        O.cut(tl, $("tor"), U + 0.55);

        // The rewritten question folds into a small paper packet at your Mac, wrapped in three layers (clay -> plum).
        const PX = 420, PY = 550, CW = 128, CH = 78;
        const FT = q2.offsetTop + DY, QH = q2.offsetHeight;
        // a copy of the rewritten line (as it reads once landed) folds into the packet; the line itself dims and stays
        const fold = q2.cloneNode(true);
        fold.querySelectorAll("[id]").forEach((e) => e.removeAttribute("id"));
        [fold, ...fold.querySelectorAll("*")].forEach((e) => { e.style.transform = ""; e.style.opacity = ""; });
        fold.id = "s08-zkq-fold";
        Object.assign(fold.style, { top: FT + "px" });
        pg.appendChild(fold);
        tl.fromTo(fold, { opacity: 0, x: 0, y: 0, scaleX: 1, scaleY: 1 }, { opacity: 1, duration: F, ease: "none", immediateRender: false }, B.packet - 0.34);
        tl.to(q2, { opacity: 0.4, duration: 0.2, ease: "power2.out" }, B.packet - 0.32);
        tl.to(fold, { scaleX: 0.5, duration: 0.14, ease: "power2.in" }, B.packet - 0.3);  // folded in half ...
        tl.to(fold, { x: PX - CW / 2 - 346, y: PY - CH / 2 - FT, scaleX: CW / 1228, scaleY: CH / QH, duration: 0.2, ease: "power3.inOut" }, B.packet - 0.18);  // ... and down to a packet
        const pk = O.make("div", "", pg);
        pk.style.cssText = `position:absolute;left:${PX}px;top:${PY}px;width:0;height:0`;
        const L = [["--clay", 236, 170], ["--mid", 200, 138], ["--bar", 164, 106], ["--card", CW, CH]].map(([c, w, h]) => {
          const e = O.make("div", "s08-ly", pk);
          gsap.set(e, { x: -w / 2, y: -h / 2, width: w, height: h, background: `var(${c})`, opacity: 0 });
          return e;
        });
        L[3].style.boxShadow = "inset 0 0 0 1.5px var(--card-rule)"; L[3].classList.add("s08-core"); L[3].textContent = "?";
        tl.set(fold, { opacity: 0 }, B.packet + 0.02);
        tl.set(L[3], { opacity: 1 }, B.packet + 0.02);
        [2, 1, 0].forEach((j, i) => tl.fromTo(L[j], { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.16, ease: "back.out(2)" }, B.packet + 0.04 + i * 0.07));
        // It travels the dashed route; at each Tor hop one layer peels away, and the hop ticks.
        const stops = [[760, B.hop1], [950, B.hop2], [1140, B.hop3], [1500, B.arrive]];
        let px = PX, prev = B.packet + 0.26;
        stops.forEach(([x, t], i) => {
          tl.to(pk, { x: x - PX, duration: t - prev, ease: "power2.inOut" }, prev);
          if (i < 3) {
            // the outer layer lifts off whole (it reads as a layer, not a fade), then drops away
            tl.to(L[i], { y: -L[i].offsetHeight / 2 - 30, scale: 1.12, rotation: [-8, 6, -6][i], duration: 0.22, ease: "power2.out" }, t);
            tl.to(L[i], { opacity: 0, duration: 0.18, ease: "power1.in" }, t);  // gone before it reaches the labels
            tl.fromTo(nodes[i + 1], { scale: 1.45 }, { scale: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, t);
          }
          prev = t + 0.02; px = x;
        });
        tl.fromTo(nodes[4], { scale: 1.5 }, { scale: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, B.arrive);
        const ring = O.make("div", "s08-ring", route);
        tl.fromTo(ring, { scale: 0.6, opacity: 1 }, { scale: 4.5, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, B.arrive);
        tl.to(L[3], { boxShadow: "inset 0 0 0 3px var(--clay)", duration: 0.2, ease: "power2.out" }, B.arrive);

        // As it passes, who you are is redacted: FROM at the first hop, IP at the second. A fresh key, paid anonymously.
        O.redact(tl, $("from"), B.hop1, { shake });
        O.redact(tl, $("ip"), B.hop2, { shake });
        O.cut(tl, rows[2], B.hop3);
        O.cut(tl, rows[3], B.arrive);
        O.stamp(tl, $("paid"), B.paid, { rot: -7, jolt: [shake], amp: 4, ink: 1 });

        // The page turns to the terms.
        O.peel(tl, P, B.turn, { dur: C.tail });
        tl.set({}, {}, end);
        window.__timelines["s08-zkq"] = tl;
      });
    })();
  </script>
</template>
</body></html>
