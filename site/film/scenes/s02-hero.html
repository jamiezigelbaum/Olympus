<!doctype html>
<html><head><meta charset="UTF-8" /></head>
<body>
<template>
  <style>
    @font-face{font-family:"Newsreader";font-style:normal;font-weight:200 800;font-display:block;src:url("assets/fonts/newsreader.woff2") format("woff2");}
    @font-face{font-family:"Newsreader";font-style:italic;font-weight:200 800;font-display:block;src:url("assets/fonts/newsreader-italic.woff2") format("woff2");}
    @font-face{font-family:"Martian Mono";font-weight:100 800;font-display:block;src:url("assets/fonts/martian-mono.woff2") format("woff2");}
    @font-face{font-family:"Arimo";font-weight:700;font-display:block;src:url("assets/fonts/arimo-700.woff2") format("woff2");}
    #root { position: absolute; inset: 0; overflow: hidden; }
    #s02-hero-line { position: absolute; left: 96px; top: 186px; margin: 0; font-family: "Newsreader"; font-weight: 300;
      font-size: 150px; line-height: 1.02; letter-spacing: -0.025em; color: var(--ink); }
    #s02-hero-line .row { display: block; white-space: nowrap; }
    #s02-hero-line .k { display: inline-block; white-space: pre; clip-path: inset(-0.35em 0 -0.35em -0.2em); vertical-align: baseline; }
    #s02-hero-line em { font-style: italic; }
    #s02-hero-req { position: absolute; left: 96px; top: 548px; font-family: "Martian Mono"; font-size: 44px; color: var(--ink); white-space: pre; }
    /* the short cut opens here: the same hand-off from the Her film's last frame as s01-open */
    #s02-hero-her { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #s02-hero-veil { position: absolute; inset: 0; opacity: 0;
      background: radial-gradient(120% 90% at 30% 0%, var(--peach) 0%, var(--sweep) 45%, var(--cream) 100%); }
    #s02-hero-lift { position: absolute; left: 330px; top: 200px; width: 1260px; height: 760px; border-radius: 40px;
      background: rgba(150, 90, 50, 0.32); filter: blur(60px); opacity: 0; }
    .s02-ul { position: absolute; left: 0; top: 0; height: 5px; width: 10px; background: var(--red); border-radius: 3px; transform-origin: 0 50%; }
  </style>
  <div id="root" data-composition-id="s02-hero" data-width="1920" data-height="1080">
    <div class="pan" id="s02-hero-pan"><div class="cam" id="s02-hero-cam"><div class="shake" id="s02-hero-shake"></div></div></div>
  </div>
  <script>
    (function () {
      const O = window.OLY, T = window.OLY_TL, C = T.scenes["s02-hero"], B = C.beats;
      const $ = (id) => document.getElementById("s02-hero-" + id);
      const shake = $("shake");
      // opts.lead (the short cut): this page opens the film, landing from the Her frame, and leaves by turning;
      // opts.request === false drops the request and BLOCK (the Her film has just shown them): the status is already blocked.
      const LEAD = !!C.opts.lead, REQ = C.opts.request !== false;
      if (LEAD) {
        $("pan").insertAdjacentHTML("beforebegin", '<img id="s02-hero-her" src="assets/handoff/her-v14-last-clean.png" alt="" /><div id="s02-hero-veil"></div>');
        O.make("div", "", shake).id = "s02-hero-lift";
      }
      const P = O.page(shake, { flap: B.turn != null, header: ["Access request", 'Status: <span id="s02-hero-st">blocked</span>'] });
      P.sheet.insertAdjacentHTML("beforeend", `
        <h1 id="s02-hero-line"><span class="row"><span class="k" id="s02-hero-k1"><span id="s02-hero-not1">Not</span> </span><em id="s02-hero-your1">your</em> machine,</span><span class="row"><span class="k" id="s02-hero-k2"><span id="s02-hero-not2">not</span> </span><em id="s02-hero-your2">your</em> memory.</span></h1>
        ${REQ ? '<div id="s02-hero-req">REQUEST  <span class="atom" id="s02-hero-q">“Allow full access?”</span></div>' : ""}`);
      // BLOCK / ALLOW (Her shot 15): cream and clay, on the page but outside the paper's clip so the bloom can spill.
      const BL = REQ && O.button(P.page, "BLOCK", { kind: "idle", x: 1030, y: 768, w: 270, h: 120, fs: 56 });
      const AL = REQ && O.button(P.page, "ALLOW", { kind: "clay", x: 1320, y: 768, w: 270, h: 120, fs: 56 });
      if (REQ) gsap.set([BL.b, AL.b], { opacity: 0 });

      O.ready(() => {
        const tl = gsap.timeline({ paused: true });
        const end = C.dur + C.tail;
        O.drift(tl, $("cam"), end, { dx: -10, s1: 1.012 });
        if (LEAD) {
          // the Her frame blurs and warms into the desk while this page rises onto it (as s01-open does in the long cut)
          tl.fromTo($("her"), { filter: "blur(0px)" }, { filter: "blur(28px)", duration: B.land, ease: "power1.in" }, 0);
          tl.fromTo($("veil"), { opacity: 0 }, { opacity: 1, duration: B.land - 0.08, ease: "power1.in" }, 0.08);
          tl.set($("her"), { opacity: 0 }, B.land + 0.05);
          tl.to($("veil"), { opacity: 0, duration: 0.8, ease: "power1.inOut" }, B.land + 0.1);
          const sp = O.spring(0.8), RD = 1.0, r0 = Math.max(0, B.land - sp.land * RD);
          tl.fromTo(P.page, { y: 1010, rotation: -2, scale: 1.035, transformOrigin: "50% 60%" }, { y: 0, rotation: 0, scale: 1, duration: RD, ease: sp }, r0);
          tl.fromTo($("lift"), { opacity: 0.9, y: 1010, scale: 1.08 }, { opacity: 0, y: 0, scale: 0.94, duration: RD * 0.75, ease: sp }, r0);
        }

        // The line rises word by word and holds until it has been read.
        const words = [...$("line").querySelectorAll(".row")].flatMap((r) => O.split(r));
        O.rise(tl, words, B.line, { dur: 0.6, stagger: 0.07 });

        // "Not" and "not" are redacted (the film's redaction style, timeline.json) ...
        O.redact(tl, $("not1"), B.strike1, { shake });
        O.redact(tl, $("not2"), B.strike2, { shake });

        // ... HERO: the redactions hold, then collapse to nothing and the line slides left into place, settling on the drop.
        const R = B.reflow, c0 = R - 0.45;  // v04: a quicker collapse (Jamie: speed the whole sequence)
        const w1 = O.collapse(tl, $("k1"), null, c0, R, "power3.inOut");
        O.collapse(tl, $("k2"), null, c0, R, "power3.inOut");
        // the landing: a small overshoot left and back, the page jolts, the camera punches in a hair
        tl.fromTo($("line"), { x: 0 }, { x: -8, duration: 0.06, ease: "power2.out", immediateRender: false }, R);
        tl.to($("line"), { x: 0, duration: 0.3, ease: "power2.inOut" }, R + 0.06);
        tl.fromTo(P.page, { y: 0 }, { y: 4, duration: O.FR, ease: "none", immediateRender: false }, R);
        tl.to(P.page, { y: 0, duration: 0.25, ease: "power2.out" }, R + O.FR);
        // the italic "your" gets a red hairline, drawn on the hit (on the paper when the page turns, so it goes with it)
        const UH = B.turn != null ? P.sheet : P.page, UR = B.turn != null ? P.sheet : shake;
        [["your1", w1], ["your2", O.box($("k2"), shake).w]].forEach(([id, w], i) => {
          const r = O.box($(id), UR), ul = O.make("div", "s02-ul", UH);
          gsap.set(ul, { x: r.x - w + 4, y: r.y + r.h * 0.86, width: r.w - 2 });
          tl.fromTo(ul, { scaleX: 0, opacity: 0 }, { scaleX: 0.35, opacity: 1, duration: O.FR, ease: "none", immediateRender: true }, R + i * 0.04);
          tl.to(ul, { scaleX: 1, duration: 0.22, ease: "expo.out" }, R + O.FR + i * 0.04);
        });

        // Then the request arrives, BLOCK / ALLOW extrude from the paper, and a cursor (Her shot 15) clicks BLOCK:
        // it sinks and blooms red. Blocked, the request is redacted.
        if (REQ) {
        O.drop(tl, O.split($("req")), B.request, { stagger: 0.09 });
        O.extrude(tl, BL, B.buttons, { dur: 0.3 });
        O.extrude(tl, AL, B.buttons + 0.05, { dur: 0.3 });
        const cur = O.cursor(shake, { size: 300 });
        cur.click(tl, 1030 + 246, 768 + 74, B.block);  // the tip on the face's right edge: "BLOCK" stays readable
        O.press(tl, BL, B.block, { pulseTo: end });
        tl.fromTo(AL.b, { filter: "saturate(1) brightness(1)" }, { filter: "saturate(0.7) brightness(0.92)", duration: 0.3, ease: "power2.out", immediateRender: false }, B.block + 0.1);
        O.cut(tl, $("st"), B.block + 0.1);  // the header says blocked once it is
        O.redact(tl, $("q"), B.reqstrike, { shake });
        cur.leave(tl, B.cursorOut);
        }

        // Camera pans down the dossier to the next page (the incoming page moves with the same curve),
        // or, in the short cut, the page turns to the one under it.
        if (B.pan != null) tl.to($("pan"), { y: -1100, duration: C.tail, ease: "power3.inOut" }, B.pan);
        if (B.turn != null) O.peel(tl, P, B.turn, { dur: C.tail });
        tl.set({}, {}, end);
        window.__timelines["s02-hero"] = tl;
      });
    })();
  </script>
</template>
</body></html>
